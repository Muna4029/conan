name: Main Workflow

on: push

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref
    }}
  cancel-in-progress: true

jobs:
  # -------------------------
  # 1. Ensure latest release tag merged
  # -------------------------
  ensure_latest_tag_merged:
    runs-on: ubuntu-latest
    name: Ensure latest release is merged in develop2 branch
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - shell: bash
      run: |
        git fetch --tags --prune
        latest_tag=$(git tag -l --sort=-v:refname | head -n1)
        echo "Checking that branch 'develop2' contains the latest release tag: $latest_tag"
        git merge-base --is-ancestor "$latest_tag" origin/develop2

  # -------------------------
  # 2. Determine Python versions
  # -------------------------
  set_python_versions:
    runs-on: ubuntu-latest
    outputs:
      python_versions_linux: ${{ steps.set_versions.outputs.python_versions_linux
        }}
      python_versions_macos: ${{ steps.set_versions.outputs.python_versions_macos
        }}
    steps:
    - name: Determine Python versions
      id: set_versions
      run: |
        if [[ "${{ github.ref }}" == "refs/heads/develop2" || "${{ github.ref }}" == refs/heads/release/* ]]; then
          echo 'python_versions_linux=["3.14","3.7"]' >> $GITHUB_OUTPUT
          echo 'python_versions_macos=["3.14","3.8"]' >> $GITHUB_OUTPUT
        else
          echo 'python_versions_linux=["3.10"]' >> $GITHUB_OUTPUT
          echo 'python_versions_macos=["3.10"]' >> $GITHUB_OUTPUT
        fi

  # -------------------------
  # 3. Linux Tests
  # -------------------------
  linux_tests:
    needs: [ensure_latest_tag_merged, set_python_versions]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ fromJson(needs.set_python_versions.outputs.python_versions_linux)
          }}
        test-type: [unittests, integration, functional]
        include:
        - test-type: unittests
          test-name: Unit
        - test-type: integration
          test-name: Integration
        - test-type: functional
          test-name: Functional
    name: Linux ${{ matrix.test-name }} (${{ matrix.python-version }})
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt')
          }}
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r conans/requirements.txt
        pip install -r conans/requirements_dev.txt
        pip install -r conans/requirements_server.txt
        pip install meson
    - name: Run tests
      uses: ./.github/actions/test-coverage
      with:
        python-version: ${{ matrix.python-version }}
        test-type: ${{ matrix.test-type }}
        tests: test/${{ matrix.test-type }}

  # -------------------------
  # 4. macOS Tests
  # -------------------------
  macos_tests:
    needs: [ensure_latest_tag_merged, set_python_versions]
    runs-on: macos-14
    strategy:
      matrix:
        python-version: ${{ fromJson(needs.set_python_versions.outputs.python_versions_macos)
          }}
        test-type: [unittests, integration, functional]
        include:
        - test-type: unittests
          test-name: Unit
        - test-type: integration
          test-name: Integration
        - test-type: functional
          test-name: Functional
    name: macOS ${{ matrix.test-name }} (${{ matrix.python-version }})
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt')
          }}
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r conans/requirements.txt
        pip install -r conans/requirements_server.txt
        pip install -r conans/requirements_dev.txt
        pip install meson
    - name: Run tests
      uses: ./.github/actions/test-coverage
      with:
        python-version: ${{ matrix.python-version }}
        test-type: ${{ matrix.test-type }}
        tests: test/${{ matrix.test-type }}
