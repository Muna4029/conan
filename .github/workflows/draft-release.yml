name: Build and Draft Release

on:
  push:
    branches:
      # - 'develop2'
      # - 'release/2.*'
      - 'czoido/test-release' # remove after testing

jobs:
  prepare:
    name: Prepare Build
    runs-on: ubuntu-latest
    outputs:
      conan_version: ${{ steps.vars.outputs.conan_version }}

    steps:
      - name: Checkout conan repository
        uses: actions/checkout@v4

      - name: Extract version
        id: vars
        run: |
          # Extract version from __init__.py
          VERSION=$(awk -F"'" '/__version__ =/ {print $2}' conan/__init__.py)
          echo "conan_version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version found: $VERSION"

      - name: Generate Read-Only App Token
        id: generate_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_RELEASE_ID }}
          private-key: ${{ secrets.GH_APP_RELEASE_PRIVATE_KEY }}
          permission-contents: read
          owner: conan-io
          repositories: |
            conan
            release-tools

      - name: Checkout release-tools repository
        uses: actions/checkout@v4
        with:
          repository: conan-io/release-tools
          token: ${{ steps.generate_token.outputs.token }}
          path: release-tools

      - name: Get Changelog
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
        run: |
          pip install PyGithub
          python3 release-tools/release/get_changelog.py ${{ steps.vars.outputs.conan_version }} --format=md > release-notes-${{ steps.vars.outputs.conan_version }}.md 2>&1 || true

      - name: Upload changelog artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes-${{ steps.vars.outputs.conan_version }}.md

  package:
    name: Package for ${{ matrix.platform }}/${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            arch: x86_64
            runner: ubuntu-latest
          - platform: Windows
            arch: x86_64
            runner: windows-latest
          - platform: Windows
            arch: i686
            runner: windows-latest
          - platform: Windows
            arch: arm64
            runner: windows-11-arm
          - platform: Macos
            arch: arm64
            runner: macos-14
          - platform: Macos
            arch: x86_64
            runner: macos-14
          - platform: Linux
            arch: arm64
            runner: ubuntu-22.04-arm
    steps:
      - name: Generate Read-Only App Token
        id: generate_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_RELEASE_ID }}
          private-key: ${{ secrets.GH_APP_RELEASE_PRIVATE_KEY }}
          permission-contents: read
          owner: conan-io
          repositories: |
            conan
            release-tools

      - name: Checkout release-tools repository
        uses: actions/checkout@v4
        with:
          repository: conan-io/release-tools
          token: ${{ steps.generate_token.outputs.token }}

      - name: Build packages
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          rm -rf dist
          ./jenkins/build_packages.sh ${{ needs.prepare.outputs.conan_version }} ${{ github.sha }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: conan-packages-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*

  # Job to create a DRAFT release (only for release branches)
  create-draft:
    name: Create Draft Release
    needs: [prepare, package]
    runs-on: ubuntu-latest
    # This job only runs for branches like 'release/2.X'
    # if: startsWith(github.ref_name, 'release/2.') # uncomment later, now for testing
    steps:
      - name: Generate Write-Access App Token
        id: generate_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_RELEASE_ID }}
          private-key: ${{ secrets.GH_APP_RELEASE_PRIVATE_KEY }}
          permission-contents: read # change to write for the real one

      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          pattern: conan-packages-*
          path: dist
          merge-multiple: true

      - name: Download changelog
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: List downloaded files
        run: |
          ls
          ls dist

